name: Release Notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Generate release notes
        run: npx tsx scripts/generate-release-notes.ts

      - name: Sync docs to app
        run: npx tsx scripts/sync-docs-to-app.ts

      - name: Commit updated release notes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update release notes [skip ci]"
          file_pattern: "RELEASE-NOTES.md src/app/(marketing)/changelog/**"
