name: User Guide

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  user-guide:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Generate user guide
        run: npx tsx scripts/generate-user-guide.ts

      - name: Sync docs to app
        run: npx tsx scripts/sync-docs-to-app.ts

      - name: Commit updated user guide
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update user guide [skip ci]"
          file_pattern: "USER-GUIDE.md src/app/(marketing)/guide/**"
